{% extends "base.html" %}

{% block title %}Create Account — Fleet Support Payments{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Create New Account</h1>

        <form method="post" class="card p-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="full_name" name="full_name" required autofocus>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Initial Password</label>
                <input type="password" class="form-control" id="password" name="password" minlength="8" required>
                <div class="form-text">
                    At least 8 characters. Share this with them separately — they can change it
                    themselves once logged in via Change Password.
                </div>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Initial Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary mt-3">Back to Users</a>
    </div>
</div>
{% endblock %}
