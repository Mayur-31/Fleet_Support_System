{% extends "base.html" %}

{% block title %}Reset Password — Fleet Support Payments{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="mb-4 text-center">Set a new password</h1>

        <form method="post" class="card p-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="new_password" class="form-label">New Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    required
                    autofocus>
                <div class="form-text">At least 8 characters.</div>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    required>
            </div>

            <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
